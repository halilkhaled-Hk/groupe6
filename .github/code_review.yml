name: IA Code Review

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout du code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lancer l’analyse IA
      run: |
        python ia_agent/main.py

    - name: Vérification typée avec mypy
      run: |
        mypy ia_agent/

    - name: Vérification ESLint
      run: |
        npx eslint . --ext .js

    - name: Formatage Prettier
      run: |
        npx prettier --check "**/*.{js,css,html}"


    - name: Bloquer si erreurs
      if: failure()
      run: echo "Erreurs détectées. Commit bloqué."
